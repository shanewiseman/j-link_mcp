apiVersion: ci.jenkinsservice.dev/v1
runtime:
  image: ghcr.io/astral-sh/uv:0.8.15-python3.12-bookworm-slim@sha256:0664f9b563fb559314ae82b9d87cd34d503f98a96d8cd9b37fd9d9cfe76d5ede
  timeoutMinutes: 60
  cpu: 4
  memory: 4Gi
  pids: 1024
  network: none
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    UV_CACHE_DIR: .ci-cache/uv
    UV_LINK_MODE: copy
steps:
  standards:
    - id: bootstrap
      name: Frozen dependency bootstrap
      command: ["scripts/ci-bootstrap.sh"]
      network: egress
      timeoutMinutes: 15
    - id: native-static
      name: Lock, lint, format, and compile validation
      command: ["scripts/validate-native-static.sh"]
      network: none
  tests:
    - id: core-tests
      name: Core native tests and branch coverage
      command: ["scripts/test-core-native.sh"]
      network: none
      timeoutMinutes: 30
      reports:
        - type: junit
          path: artifacts/junit-core.xml
        - type: coverage
          path: artifacts/coverage-core.xml
    - id: arduino-giga-tests
      name: Arduino GIGA native tests and branch coverage
      command: ["scripts/test-arduino-giga-native.sh"]
      network: none
      timeoutMinutes: 30
      reports:
        - type: junit
          path: artifacts/junit-arduino-giga.xml
        - type: coverage
          path: artifacts/coverage-arduino-giga.xml
    - id: protocol-bridge-tests
      name: Protocol bridge native tests and branch coverage
      command: ["scripts/test-protocol-bridge-native.sh"]
      network: none
      timeoutMinutes: 30
      reports:
        - type: junit
          path: artifacts/junit-protocol-bridge.xml
        - type: coverage
          path: artifacts/coverage-protocol-bridge.xml
  custom:
    - id: repository-sbom
      name: Repository CycloneDX validation
      command: ["scripts/validate-sboms.sh"]
      network: none
      timeoutMinutes: 15
      reports:
        - type: cyclonedx
          path: artifacts/sbom/jlink-mcp.cdx.json
    - id: wheel-validation
      name: Independent wheel validation
      command: ["scripts/validate-distributions.sh"]
      network: none
      timeoutMinutes: 15
    - id: core-neutrality
      name: Core target-neutrality validation
      command: ["scripts/validate-core-neutrality.sh"]
      network: none
    - id: proprietary-artifacts
      name: Proprietary artifact validation
      command: ["scripts/validate-proprietary-artifacts.sh"]
      network: none
security:
  gitleaks: true
  trivy: true
artifacts:
  - name: native-reports
    path: artifacts/**
    required: true
review:
  enabled: true
  pullRequestsOnly: true
  criticalSeverities:
    - critical
  maxDiffBytes: 200000
